name: momentum-blend
on:
  schedule:
    - cron: "45 4 1,15 * *"   # har mahine 1 aur 15 tareekh, 10:15 AM IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance requests pandas numpy
      - run: python momentum_blend.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Save holdings
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add blend_holdings.json
          git commit -m "update holdings" || echo "no changes"
          git push
